apiVersion: batch/v1
kind: Job
metadata:
  name: otlp-trace-test
  namespace: opentelemetry
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: otlp-trace-test
    spec:
      restartPolicy: Never
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.146.0
          env:
            - name: OTEL_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: otel-client-token
                  key: token
          args:
            - "traces"
            - "--otlp-endpoint=otlp.lab.vac.dev:31317"
            - "--otlp-insecure"
            - "--otlp-header"
            - "Authorization=\"Bearer $(OTEL_CLIENT_TOKEN)\""
            - "--traces=5"
            - "--otlp-attributes"
            - "service.name=\"otlp-trace-test\""
