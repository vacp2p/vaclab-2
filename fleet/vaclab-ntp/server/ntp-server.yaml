apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ntp-server
spec:
  replicas: 1
  serviceName: ntp-server
  selector:
    matchLabels:
      app: ntp-server
  template:
    metadata:
      labels:
        app: ntp-server
    spec:
      # No hostNetwork / SYS_TIME: this pod never disciplines any host's
      # real kernel clock directly (that was the suspected cause of the
      # unresolved, still-growing frequency error under the old design).
      # It's a pure NTP relay - syncs from upstream as a client, serves that
      # time over the wire via the ntp-server-nodeport Service. Every
      # cluster host, including metal-01, syncs against it as a uniform NTP
      # client.
      #
      # Pinned to node-01: node-01..05 are all in the same location
      # (ih-eu-mda1); metal-01 is the one outlier, in a different location
      # (he-eu-hel1) with a confirmed real ~53ms RTT to the others. Pinning
      # the server here gives 4 of 5 client hosts a genuine same-LAN path,
      # and only metal-01 carries the long WAN hop, instead of the reverse.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - node-01.ih-eu-mda1.misc.vaclab
      containers:
        - name: ntp-server
          resources:
            requests:
              memory: "1Gi"
              cpu: "2"
            limits:
              memory: "1Gi"
              cpu: "2"
          image: cturra/ntp:latest
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: conf
              mountPath: /etc/chrony/chrony.conf
              subPath: chrony.conf
            - name: ntp-drift
              mountPath: /var/lib/chrony
      volumes:
        - name: conf
          configMap:
            name: vaclab-ntp-server-conf
  volumeClaimTemplates:
    - metadata:
        name: ntp-drift
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-vaclab
        resources:
          requests:
            storage: 1Gi
