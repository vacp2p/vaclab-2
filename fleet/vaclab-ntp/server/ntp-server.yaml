apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ntp-server
spec:
  replicas: 1
  serviceName: ntp-server
  selector:
    matchLabels:
      app: ntp-server
  template:
    metadata:
      labels:
        app: ntp-server
    spec:
      # No hostNetwork / SYS_TIME / node pinning: this pod never disciplines
      # any host's real kernel clock directly (that was the suspected cause
      # of the unresolved, still-growing frequency error on metal-01). It's
      # a pure NTP relay - syncs from upstream as a client, serves that time
      # over the wire via the ntp-server-nodeport Service. Every cluster
      # host, including metal-01, syncs against it as a uniform NTP client.
      containers:
        - name: ntp-server
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          image: cturra/ntp:latest
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: conf
              mountPath: /etc/chrony/chrony.conf
              subPath: chrony.conf
            - name: ntp-drift
              mountPath: /var/lib/chrony
      volumes:
        - name: conf
          configMap:
            name: vaclab-ntp-server-conf
  volumeClaimTemplates:
    - metadata:
        name: ntp-drift
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-vaclab
        resources:
          requests:
            storage: 1Gi
