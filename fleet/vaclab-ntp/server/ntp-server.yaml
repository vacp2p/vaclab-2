apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ntp-server
spec:
  replicas: 1
  serviceName: ntp-server
  selector:
    matchLabels:
      app: ntp-server
  template:
    metadata:
      labels:
        app: ntp-server
    spec:
      # hostNetwork + SYS_TIME: this pod directly disciplines metal-01's
      # real kernel clock. Without SYS_TIME, chronyd can only *measure*
      # drift and mathematically compensate for it in served responses, but
      # never actually correct the underlying clock. Confirmed by direct
      # testing on TWO different nodes (metal-01, then node-01 after
      # relocating to rule out WAN-latency as the cause): both showed the
      # same unbounded, worsening divergence (skew climbing past 100-800ppm,
      # root dispersion into the tens-to-hundreds of ms) instead of
      # converging. A proven-working makestep test earlier showed
      # SYS_TIME/adjtimex genuinely works when present (landed a real
      # 1.169s -> 2ms correction), so this reverts to that design.
      #
      # Because this pod owns metal-01's real port 123 via hostNetwork,
      # metal-01 must NOT also run a native host-level chrony client - see
      # ansible/inventory.yaml's ntp_server_hosts group. Two daemons
      # disciplining the same kernel clock fight each other (confirmed via
      # ss -ulnp showing two chronyd PIDs both bound to 127.0.0.1:323).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - metal-01.he-eu-hel1.misc.vacdst
      containers:
        - name: ntp-server
          resources:
            requests:
              memory: "1Gi"
              cpu: "2"
            limits:
              memory: "1Gi"
              cpu: "2"
          image: cturra/ntp:latest
          # The image's own /opt/startup.sh unconditionally execs
          # `chronyd -u chrony -d -x -L ...` - the -x flag is hardcoded, not
          # controlled by any env var, and disables clock control
          # regardless of SYS_TIME/seccomp granted at the pod level. This
          # replicates the script's permission-fixup steps (needed for the
          # ntp-drift PVC and /run/chrony) but drops -x. Our own ConfigMap
          # already provides the full chrony.conf, so the script's env-var
          # -driven config generation isn't needed either.
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -d /run/chrony ]; then
                chown -R chrony:chrony /run/chrony
                chmod o-rx /run/chrony
                rm -f /var/run/chrony/chronyd.pid
              fi
              if [ -d /var/lib/chrony ]; then
                chown -R chrony:chrony /var/lib/chrony
              fi
              exec /usr/sbin/chronyd -u chrony -d -L 0
          securityContext:
            capabilities:
              add: ["SYS_TIME", "NET_BIND_SERVICE"]
            # SYS_TIME alone isn't enough: since glibc 2.31, adjtimex() calls
            # the clock_adjtime syscall, which containerd's default seccomp
            # profile doesn't whitelist even under CAP_SYS_TIME (moby/moby
            # #40919, #40929). This let discrete step corrections through
            # (clock_settime, a different syscall - confirmed working via
            # the earlier makestep test) while silently blocking the
            # continuous ADJ_FREQUENCY corrections chronyd needs to keep
            # drift bounded between polls, matching exactly what we
            # observed: confident, unchanging Frequency estimate, tiny
            # Last offset each poll, but System time growing unboundedly.
            seccompProfile:
              type: Unconfined
          volumeMounts:
            - name: conf
              mountPath: /etc/chrony/chrony.conf
              subPath: chrony.conf
            - name: ntp-drift
              mountPath: /var/lib/chrony
      volumes:
        - name: conf
          configMap:
            name: vaclab-ntp-server-conf
  volumeClaimTemplates:
    - metadata:
        name: ntp-drift
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-vaclab
        resources:
          requests:
            storage: 1Gi
