apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ntp-server
spec:
  replicas: 1
  serviceName: ntp-server
  selector:
    matchLabels:
      app: ntp-server
  template:
    metadata:
      labels:
        app: ntp-server
    spec:
      # hostNetwork + SYS_TIME: this pod directly disciplines metal-01's
      # real kernel clock. Without SYS_TIME, chronyd can only *measure*
      # drift and mathematically compensate for it in served responses, but
      # never actually correct the underlying clock. Confirmed by direct
      # testing on TWO different nodes (metal-01, then node-01 after
      # relocating to rule out WAN-latency as the cause): both showed the
      # same unbounded, worsening divergence (skew climbing past 100-800ppm,
      # root dispersion into the tens-to-hundreds of ms) instead of
      # converging. A proven-working makestep test earlier showed
      # SYS_TIME/adjtimex genuinely works when present (landed a real
      # 1.169s -> 2ms correction), so this reverts to that design.
      #
      # Because this pod owns metal-01's real port 123 via hostNetwork,
      # metal-01 must NOT also run a native host-level chrony client - see
      # ansible/inventory.yaml's ntp_server_hosts group. Two daemons
      # disciplining the same kernel clock fight each other (confirmed via
      # ss -ulnp showing two chronyd PIDs both bound to 127.0.0.1:323).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - metal-01.he-eu-hel1.misc.vacdst
      containers:
        - name: ntp-server
          resources:
            requests:
              memory: "1Gi"
              cpu: "2"
            limits:
              memory: "1Gi"
              cpu: "2"
          image: cturra/ntp:latest
          securityContext:
            capabilities:
              add: ["SYS_TIME", "NET_BIND_SERVICE"]
          volumeMounts:
            - name: conf
              mountPath: /etc/chrony/chrony.conf
              subPath: chrony.conf
            - name: ntp-drift
              mountPath: /var/lib/chrony
      volumes:
        - name: conf
          configMap:
            name: vaclab-ntp-server-conf
  volumeClaimTemplates:
    - metadata:
        name: ntp-drift
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-vaclab
        resources:
          requests:
            storage: 1Gi
