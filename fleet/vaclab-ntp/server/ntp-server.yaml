apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ntp-server
spec:
  replicas: 1
  serviceName: ntp-server
  selector:
    matchLabels:
      app: ntp-server
  template:
    metadata:
      labels:
        app: ntp-server
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - metal-01.he-eu-hel1.misc.vacdst
      containers:
        - name: ntp-server
          resources:
            # requests.cpu != limits.cpu on purpose: this must NOT be
            # Guaranteed QoS. A Guaranteed pod gets an exclusive, pinned
            # physical core under the cluster's static CPU manager policy,
            # which is suspected of causing this pod's chronyd to measure a
            # large, still-growing clock frequency error (~500ppm) despite
            # otherwise clean, low-noise measurements.
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          image: cturra/ntp:latest
          securityContext:
            capabilities:
              add: ["SYS_TIME", "NET_BIND_SERVICE"]
          volumeMounts:
            - name: conf
              mountPath: /etc/chrony/chrony.conf
              subPath: chrony.conf
            - name: ntp-drift
              mountPath: /var/lib/chrony
      volumes:
        - name: conf
          configMap:
            name: vaclab-ntp-server-conf
  volumeClaimTemplates:
    - metadata:
        name: ntp-drift
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-vaclab
        resources:
          requests:
            storage: 1Gi