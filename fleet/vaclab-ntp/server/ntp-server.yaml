apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ntp-server
spec:
  replicas: 1
  serviceName: ntp-server
  selector:
    matchLabels:
      app: ntp-server
  template:
    metadata:
      labels:
        app: ntp-server
    spec:
      # No hostNetwork / SYS_TIME: this pod never disciplines any host's
      # real kernel clock directly (that was the suspected cause of the
      # unresolved, still-growing frequency error under the old design).
      # It's a pure NTP relay - syncs from upstream as a client, serves that
      # time over the wire via the ntp-server-nodeport Service. Every
      # cluster host, including metal-01, syncs against it as a uniform NTP
      # client.
      #
      # Pinned to metal-01: every client's config points at 65.21.76.50
      # (metal-01's address) regardless of where the pod runs. If the pod
      # lands elsewhere, requests take a genuine extra cross-node overlay
      # hop (client -> metal-01 -> DNAT -> tunnel -> pod's actual node) for
      # every host except whichever one happens to be co-located with the
      # pod, which then measures a structurally different (shorter/
      # asymmetric) path than everyone else. Pinning to metal-01 makes that
      # hop uniform for the other 5 hosts, so only metal-01 itself is the
      # (single, expected) local-delivery outlier.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - metal-01.he-eu-hel1.misc.vacdst
      containers:
        - name: ntp-server
          resources:
            requests:
              memory: "1Gi"
              cpu: "2"
            limits:
              memory: "1Gi"
              cpu: "2"
          image: cturra/ntp:latest
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: conf
              mountPath: /etc/chrony/chrony.conf
              subPath: chrony.conf
            - name: ntp-drift
              mountPath: /var/lib/chrony
      volumes:
        - name: conf
          configMap:
            name: vaclab-ntp-server-conf
  volumeClaimTemplates:
    - metadata:
        name: ntp-drift
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-vaclab
        resources:
          requests:
            storage: 1Gi
