apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ntp-server
spec:
  replicas: 1
  serviceName: ntp-server
  selector:
    matchLabels:
      app: ntp-server
  template:
    metadata:
      labels:
        app: ntp-server
    spec:
      # hostNetwork + SYS_TIME: this pod directly corrects metal-01's
      # real kernel clock. Without SYS_TIME, chronyd can only *measure*
      # drift and mathematically compensate for it in served responses, but
      # never actually correct the underlying clock. 
      # Because this pod owns metal-01's real port 123 via hostNetwork,
      # metal-01 must NOT also run a native host-level chrony client - see
      # ansible/inventory.yaml's ntp_server_hosts group. 2 daemons
      # disciplining the same kernel clock fight each other and cause instability.  
      # The host-level chrony client is disabled on metal-01.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - metal-01.he-eu-hel1.misc.vacdst
      containers:
        - name: ntp-server
          resources:
            requests:
              memory: "1Gi"
              cpu: "2"
            limits:
              memory: "1Gi"
              cpu: "2"
          image: cturra/ntp:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -d /run/chrony ]; then
                chown -R chrony:chrony /run/chrony
                chmod o-rx /run/chrony
                rm -f /var/run/chrony/chronyd.pid
              fi
              if [ -d /var/lib/chrony ]; then
                chown -R chrony:chrony /var/lib/chrony
              fi
              exec /usr/sbin/chronyd -u chrony -d -L 0
          securityContext:
            capabilities:
              add: ["SYS_TIME", "NET_BIND_SERVICE"]
            # SYS_TIME alone isn't enough
            seccompProfile:
              type: Unconfined
          volumeMounts:
            - name: conf
              mountPath: /etc/chrony/chrony.conf
              subPath: chrony.conf
            - name: ntp-drift
              mountPath: /var/lib/chrony
      volumes:
        - name: conf
          configMap:
            name: vaclab-ntp-server-conf
  volumeClaimTemplates:
    - metadata:
        name: ntp-drift
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-vaclab
        resources:
          requests:
            storage: 1Gi
