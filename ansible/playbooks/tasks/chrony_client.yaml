---
- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true

- name: Configure chrony to sync against the internal vaclab-ntp server, with Cloudflare as backup
  ansible.builtin.copy:
    dest: /etc/chrony/chrony.conf
    mode: '0644'
    content: |
      # Managed by Ansible: update_chrony_client.yaml
      # Primary: vaclab-ntp server pod, reached via its NodePort (30123/udp)
      # on node-01.ih-eu-mda1.misc.vaclab. NodePort routes correctly to the
      # pod regardless of which node it's actually scheduled on. Using the
      # full SSH-facing hostname (confirmed resolvable - it's what every
      # ansible connection in this playbook uses), not the bare k8s node
      # name, which is a different string and not confirmed resolvable at
      # the OS/DNS level.
      server node-01.ih-eu-mda1.misc.vaclab.status.im port 30123 iburst prefer
      # Backup: only used if the vaclab-ntp server is unreachable.
      server time.cloudflare.com iburst
      driftfile /var/lib/chrony/chrony.drift
      rtcsync
      makestep 1.0 3
      logdir /var/log/chrony
  notify: Restart chrony

- name: Ensure chrony service is enabled and running
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true
