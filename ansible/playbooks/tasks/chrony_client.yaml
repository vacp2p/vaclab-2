---
- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true

- name: Configure chrony to sync against the internal vaclab-ntp server, with Cloudflare as backup
  ansible.builtin.copy:
    dest: /etc/chrony/chrony.conf
    mode: '0644'
    content: |
      # Managed by Ansible: update_chrony_client.yaml
      # Primary: the sole vaclab-ntp server (metal-01.he-eu-hel1.misc.vacdst).
      # IP (not hostname) to avoid depending on DNS for time sync.
      server 65.21.76.50 iburst prefer
      # Backup: only used if metal-01 becomes unreachable.
      server time.cloudflare.com iburst
      driftfile /var/lib/chrony/chrony.drift
      rtcsync
      makestep 1.0 3
      logdir /var/log/chrony
  notify: Restart chrony

- name: Ensure chrony service is enabled and running
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true
