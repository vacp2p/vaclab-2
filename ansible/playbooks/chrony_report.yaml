---
- name: Gather chrony tracking status from client hosts
  hosts: k3s_cluster:!ntp_server_hosts
  become: true
  gather_facts: false
  tasks:
    - name: Get chrony tracking summary (host-level)
      ansible.builtin.shell: |
        set -o pipefail
        chronyc tracking | awk -F': ' '
          /^Stratum/ {stratum=$2}
          /^System time/ {
            split($2, a, " "); v = a[1] + 0
            if ($2 ~ /fast/) v = -v
            sys_ms = v * 1000
          }
          /^Last offset/ {
            split($2, a, " "); lastoff_ms = (a[1] + 0) * 1000
          }
          /^RMS offset/ {
            split($2, a, " "); rms_ms = (a[1] + 0) * 1000
          }
          /^Root dispersion/ {
            split($2, a, " "); rootdisp_ms = (a[1] + 0) * 1000
          }
          /^Leap status/ {leap=$2}
          END {printf "%s,%.3f,%.3f,%.3f,%.3f,%s", stratum, sys_ms, lastoff_ms, rms_ms, rootdisp_ms, leap}
        '
      args:
        executable: /bin/bash
      register: chrony_summary
      changed_when: false

# ntp_server_hosts (currently just metal-01) have no host-level chronyc
# anymore - only the co-located ntp-server pod (replicas: 1, ordinal 0)
# disciplines that host's clock. Query the pod itself instead.
- name: Gather chrony tracking status from the vaclab-ntp server pod
  hosts: server[0]
  become: false
  gather_facts: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Get chrony tracking summary from ntp-server-0
      ansible.builtin.shell: |
        set -o pipefail
        kubectl exec -n vaclab-ntp ntp-server-0 -- chronyc tracking | awk -F': ' '
          /^Stratum/ {stratum=$2}
          /^System time/ {
            split($2, a, " "); v = a[1] + 0
            if ($2 ~ /fast/) v = -v
            sys_ms = v * 1000
          }
          /^Last offset/ {
            split($2, a, " "); lastoff_ms = (a[1] + 0) * 1000
          }
          /^RMS offset/ {
            split($2, a, " "); rms_ms = (a[1] + 0) * 1000
          }
          /^Root dispersion/ {
            split($2, a, " "); rootdisp_ms = (a[1] + 0) * 1000
          }
          /^Leap status/ {leap=$2}
          END {printf "%s,%.3f,%.3f,%.3f,%.3f,%s", stratum, sys_ms, lastoff_ms, rms_ms, rootdisp_ms, leap}
        '
      args:
        executable: /bin/bash
      register: chrony_summary_ntp_server_pod
      changed_when: false

- name: Display cluster-wide chrony sync table
  hosts: server[0]
  become: false
  gather_facts: false
  tasks:
    - name: Print combined table
      vars:
        header: "{{ '%-32s %-8s %12s %14s %10s %14s %-8s' | format('HOST', 'STRATUM', 'OFFSET(ms)', 'LASTOFF(ms)', 'RMS(ms)', 'ROOTDISP(ms)', 'LEAP') }}"
      ansible.builtin.debug:
        msg: |
          {{ header }}
          {% for item in groups['k3s_cluster'] %}
          {% if item in groups['ntp_server_hosts'] %}
          {% set f = chrony_summary_ntp_server_pod.stdout.split(',') %}
          {{ '%-32s %-8s %12s %14s %10s %14s %-8s' | format(item | regex_replace('\.status\.im$', '') ~ ' (via pod)', f[0], f[1], f[2], f[3], f[4], f[5]) }}
          {% else %}
          {% set f = hostvars[item].chrony_summary.stdout.split(',') %}
          {{ '%-32s %-8s %12s %14s %10s %14s %-8s' | format(item | regex_replace('\.status\.im$', ''), f[0], f[1], f[2], f[3], f[4], f[5]) }}
          {% endif %}
          {% endfor %}
