---
- name: Gather chrony sync status from all cluster nodes
  hosts: k3s_cluster
  become: true
  gather_facts: false
  tasks:
    - name: Get chrony tracking summary
      ansible.builtin.shell: |
        set -o pipefail
        chronyc tracking | awk -F': ' '
          /^Stratum/         {stratum=$2}
          /^System time/     {sys_time=$2}
          /^Last offset/     {lastoff=$2}
          /^RMS offset/      {rms=$2}
          /^Root dispersion/ {rootdisp=$2}
          /^Leap status/     {leap=$2}
          END {printf "%-8s %-32s %-18s %-18s %-18s %-12s", stratum, sys_time, lastoff, rms, rootdisp, leap}
        '
      args:
        executable: /bin/bash
      register: chrony_summary
      changed_when: false

- name: Display cluster-wide chrony sync table
  hosts: server[0]
  become: false
  gather_facts: false
  tasks:
    - name: Print table header
      ansible.builtin.debug:
        msg: "{{ '%-42s' | format('HOST') }} {{ '%-8s %-32s %-18s %-18s %-18s %-12s' | format('STRATUM', 'SYSTEM TIME OFFSET', 'LAST OFFSET', 'RMS OFFSET', 'ROOT DISPERSION', 'LEAP STATUS') }}"

    - name: Print each node's row
      ansible.builtin.debug:
        msg: "{{ '%-42s' | format(item) }} {{ hostvars[item].chrony_summary.stdout }}"
      loop: "{{ groups['k3s_cluster'] }}"
