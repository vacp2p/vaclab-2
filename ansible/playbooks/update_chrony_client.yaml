---
- name: Configure chrony NTP client on all cluster hosts
  hosts: k3s_cluster
  become: true
  handlers:
    - name: Restart chrony
      ansible.builtin.systemd:
        name: chrony
        state: restarted

  tasks:
    - name: Apply chrony client configuration
      ansible.builtin.import_tasks: tasks/chrony_client.yaml

- name: Verify chrony sync status
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Check chrony sources
      ansible.builtin.command: chronyc sources
      register: chrony_sources
      changed_when: false

    - name: Display chrony sources
      ansible.builtin.debug:
        var: chrony_sources.stdout_lines
