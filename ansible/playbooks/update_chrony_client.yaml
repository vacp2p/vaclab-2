---
- name: Remove conflicting host-level chrony on vaclab-ntp server hosts
  hosts: ntp_server_hosts
  become: true
  tasks:
    # These hosts run a vaclab-ntp server pod with hostNetwork: true, whose
    # chronyd already disciplines this host's kernel clock directly. A
    # second, independent chronyd here would fight it for control of the
    # same clock (confirmed: both ended up bound to 127.0.0.1:323 at once).
    - name: Stop and disable native chrony service
      ansible.builtin.systemd:
        name: chrony
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Remove chrony package
      ansible.builtin.apt:
        name: chrony
        state: absent

- name: Configure chrony NTP client on cluster hosts without a local ntp-server pod
  hosts: k3s_cluster:!ntp_server_hosts
  become: true
  handlers:
    - name: Restart chrony
      ansible.builtin.systemd:
        name: chrony
        state: restarted

  tasks:
    - name: Apply chrony client configuration
      ansible.builtin.import_tasks: tasks/chrony_client.yaml

- name: Verify chrony sync status
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Check chrony sources (or note that this host has no host-level chrony)
      ansible.builtin.command: chronyc sources
      register: chrony_sources
      changed_when: false
      failed_when: false

    - name: Display chrony sources
      ansible.builtin.debug:
        var: chrony_sources.stdout_lines
